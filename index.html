<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}
/* cài đặt */
.stabs{display:flex;flex-wrap:wrap;gap:6px}
.stabs button{font-size:13px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted);text-decoration:none;background:var(--surface)}
.stabs button:hover{color:var(--accent);border-color:var(--accent)}
.stbl{min-width:560px}
.stbl td{vertical-align:middle}
.sbanner{display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--warn-soft);color:var(--warn);font-size:13px;border-bottom:1px solid var(--line)}
.sbanner b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--warn);color:var(--surface);flex:none;font-size:12px}
.sformula{display:grid;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sformula div{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;font-size:13.5px}
.sformula div+div{border-top:1px solid var(--line)}
.sformula span{color:var(--muted)}
.sformula b{font-weight:600;white-space:nowrap}
.sformula b.neg{color:var(--bad)}.sformula b.mut{color:var(--muted);font-weight:500}
.sprint{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:20px}
.sprint fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.sprint legend{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--accent);padding:0;margin-bottom:10px}
.spreview{display:flex;flex-direction:column;gap:6px;min-width:0}
.sp-doc{border:1px dashed var(--line);border-radius:8px;padding:14px;background:var(--sunk);font-family:"Times New Roman",serif;font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.sp-l b,.sp-l span{font-weight:700}
.sp-r{text-align:right}
@media (max-width:900px){.sprint{grid-template-columns:1fr}}
</style>
<title>KPI · OKR (Demo)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: vertical jade sidebar (grouped nav by role, user card at foot) + light working column with sticky period bar; drawer on phones */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --sunk:#e8eeeb; --ink:#16211e; --muted:#5a6a66; --line:#d6dfdb;
  --accent:#0d6b5a; --accent-ink:#ffffff; --accent-soft:#dcece7;
  --good:#2a7a45; --good-soft:#e0f0e5; --warn:#9a5d00; --warn-soft:#f8ecd6; --bad:#b0362b; --bad-soft:#f7e2df;
  --ps:#6a4fb0; --ps-soft:#ebe5f7; --info:#2563a6; --info-soft:#e4eef9; --band:#e3ebe7; --band-ink:#3c4d48;
  --side:#0f2d27; --side-ink:#c9ddd6; --side-muted:#7f9d94; --side-hi:#1a4239; --side-strong:#ffffff; --side-accent:#7ed6c0;
  --f-body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101614; --surface:#18201e; --sunk:#141b19; --ink:#e4ebe8; --muted:#97a6a2; --line:#2a3532;
  --accent:#4fb59f; --accent-ink:#0b1311; --accent-soft:#1c332e;
  --good:#6cc48a; --good-soft:#1a3022; --warn:#e3a54a; --warn-soft:#33270f; --bad:#ee8577; --bad-soft:#3a1c18;
  --ps:#b5a0ec; --ps-soft:#2a2340; --info:#7fb0e8; --info-soft:#17263a; --band:#141c1a; --band-ink:#9fb0ab;
  --side:#0b1715; --side-ink:#b9ccc6; --side-muted:#6f8a83; --side-hi:#16302a; --side-strong:#f1f7f5; --side-accent:#6fcbb5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#18201e; --sunk:#141b19; --ink:#e4ebe8; --muted:#97a6a2; --line:#2a3532;
  --accent:#4fb59f; --accent-ink:#0b1311; --accent-soft:#1c332e;
  --good:#6cc48a; --good-soft:#1a3022; --warn:#e3a54a; --warn-soft:#33270f; --bad:#ee8577; --bad-soft:#3a1c18;
  --ps:#b5a0ec; --ps-soft:#2a2340; --info:#7fb0e8; --info-soft:#17263a; --band:#141c1a; --band-ink:#9fb0ab;
  --side:#0b1715; --side-ink:#b9ccc6; --side-muted:#6f8a83; --side-hi:#16302a; --side-strong:#f1f7f5; --side-accent:#6fcbb5; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1120px;margin:0 auto}
.mainc .inner{max-width:none}
.mainc .gut{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.band{background:var(--band);color:var(--band-ink);font-size:12.5px;padding-block:7px}
.band b{font-weight:600}
.top{background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px}
.top .inner{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:6px}
.brand small{font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who .nm{font-weight:600}
.role{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:99px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=password],input[type=number],input[type=month],input[type=date],input[type=search],select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
input:disabled,select:disabled{background:var(--sunk);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .inner{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:11px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab[aria-current=page]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.badge{background:var(--warn);color:var(--surface);font-size:11px;font-weight:700;border-radius:99px;padding:0 6px;line-height:18px}
main{padding-block:24px 64px}
main .inner{display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 16px}
.head h2{font-size:24px;letter-spacing:-.01em;padding-left:12px;border-left:4px solid var(--accent);line-height:1.2}
.head p{padding-left:16px}
.head p{margin:0;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 2px rgba(16,24,22,.05)}
.pad{padding:16px}
.notice{border-radius:8px;padding:11px 14px 11px 40px;font-size:13.5px;background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-left:4px solid var(--warn);position:relative;font-weight:500}
.notice::before{content:'!';position:absolute;left:12px;top:10px;width:18px;height:18px;border-radius:50%;background:var(--warn);color:var(--surface);font-size:12px;font-weight:700;display:grid;place-items:center}
.notice.info{background:var(--info-soft);color:var(--info);border-color:color-mix(in srgb,var(--info) 30%,transparent);border-left-color:var(--info)}
.notice.info::before{content:'i';background:var(--info)}
/* score strip */
.score{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.score>div{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0;border:1px solid var(--line);border-top:4px solid var(--muted);border-radius:var(--r);box-shadow:0 1px 2px rgba(16,24,22,.05)}
.score>div.t-info{border-top-color:var(--info)}.score>div.t-info .v{color:var(--info)}
.score>div.t-ps{border-top-color:var(--ps)}.score>div.t-ps .v{color:var(--ps)}
.score>div.t-good{border-top-color:var(--good);background:var(--good-soft)}.score>div.t-good .v{color:var(--good)}
.score>div.t-warn{border-top-color:var(--warn);background:var(--warn-soft)}.score>div.t-warn .v{color:var(--warn)}
.score>div.t-bad{border-top-color:var(--bad);background:var(--bad-soft)}.score>div.t-bad .v{color:var(--bad)}
.score>div.t-main{border-top-color:var(--accent);background:var(--accent-soft)}
.score .v{font-size:26px;font-weight:700;letter-spacing:-.01em}
.score .v.big{color:var(--accent)}
.score .s{font-size:12px;color:var(--muted)}
.meter{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.formula{font-size:12.5px;color:var(--muted)}
/* forms */
.addf{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.toolbar .search{flex:1 1 220px;max-width:360px}
.toolbar select{width:auto}
/* tables */
.tw{overflow-x:auto}
[hidden]{display:none!important}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:13px;font-weight:600;color:var(--ink,#1d2b26);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
td.cb,th.cb{width:36px;padding-right:0}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.why{font-size:12.5px;color:var(--bad);margin-top:4px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:1px 8px;white-space:nowrap}
.c-dk{background:var(--accent-soft);color:var(--accent)}
.c-ps{background:var(--ps-soft);color:var(--ps)}
.c-chua{background:var(--sunk);color:var(--muted)}
.c-cho{background:var(--warn-soft);color:var(--warn)}
.c-duyet{background:var(--good-soft);color:var(--good)}
.c-khongdat{background:var(--bad-soft);color:var(--bad)}
.c-tralai{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.c-self{background:var(--ps-soft);color:var(--ps)}
.c-lock{background:var(--sunk);color:var(--muted)}
.reason{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--sunk);padding:10px 12px}
.reason input{flex:1 1 240px}
.rank{font-weight:700;color:var(--muted)}
.rank.top{color:var(--accent)}
.pbar{height:8px;background:var(--sunk);border-radius:99px;min-width:80px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.row .field{flex:1 1 160px}
.log{list-style:none;margin:0;padding:0}
.log li{padding:8px 16px;border-top:1px solid var(--line);font-size:13px}
.log li:first-child{border-top:0}
/* login */
.login{min-height:calc(100vh - 40px);display:grid;place-items:center;padding-block:40px}
.lcard{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
.lcard h1{font-size:26px;letter-spacing:-.02em}
.lcard p{margin:0;color:var(--muted)}
.err{color:var(--bad);font-size:13px;min-height:1.2em}
.pwbox{position:relative;display:flex}
.pwbox input{flex:1;min-width:0;padding-right:42px}
.pwbox .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;color:var(--muted);padding:6px;border-radius:6px;display:flex}
.pwbox .eye:hover{color:var(--ink)}
.pwbox .eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.remember{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.remember input{width:16px;height:16px;margin:0}
/* modal + toast */
.ov{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent);display:grid;place-items:center;padding:16px;z-index:20}
.modal{width:100%;max-width:380px}
.modal.xl{max-width:900px}
.mbody{flex:1 1 auto;overflow:auto;min-height:0}
.mbody .plist{max-height:none}
.ddwrap{position:relative}
.ddmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:6px;min-width:280px;display:flex;flex-direction:column}
.ddmenu button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.ddmenu button:hover,.ddmenu button:focus-visible{background:var(--sunk)}
.ddmenu span{font-size:12.5px;color:var(--muted)}
@media (max-width:700px){.ddmenu{left:0;right:auto;min-width:min(280px,calc(100vw - 32px))}}
.modal.md{max-width:640px;max-height:92vh;overflow:auto}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fgrid .field{min-width:0;flex:none}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.modal.lg{max-width:780px;padding:0;overflow:hidden;max-height:92vh;display:flex;flex-direction:column}
.modal.lg .plist{flex:1 1 auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13.5px;max-width:calc(100% - 32px);z-index:30;box-shadow:0 6px 24px rgba(0,0,0,.18)}
@media (max-width:820px){
  .score{grid-template-columns:repeat(2,minmax(0,1fr))}
  .score>div:last-child{grid-column:1/-1}
  .addf{grid-template-columns:1fr 1fr}
  .addf .wide{grid-column:1/-1}
  .grid2{grid-template-columns:1fr}
}
.score.s4{grid-template-columns:repeat(4,minmax(0,1fr))}
.score.s4>div:last-child{grid-column:auto}
.c-okr{background:var(--warn-soft);color:var(--warn)}
td.dt{white-space:nowrap;color:var(--muted);font-size:13px}
.okrsc{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
input.sc{width:88px;text-align:right;padding:5px 8px;border-color:var(--accent)}
.tbh{font-size:12px;color:var(--muted);white-space:nowrap}
.tbh b{color:var(--accent)}
.lcard.wide{max-width:640px}
table.wide{min-width:1180px}
select[data-act=rate]{min-width:200px;width:auto}
table.wide td:nth-child(2){min-width:150px}
.neg{color:var(--bad)}
.h3{font-size:15px;margin:0}
.c-vuot{background:var(--good);color:var(--surface)}
.c-giao{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 40%,transparent)}
.c-xinxoa{background:var(--bad-soft);color:var(--bad)}
.c-HTXS{background:var(--good);color:var(--surface)}
.c-HTT{background:var(--good-soft);color:var(--good)}
.c-HTNV{background:var(--warn-soft);color:var(--warn)}
.c-KHT{background:var(--bad-soft);color:var(--bad)}
.sub.note{max-width:220px;font-size:11.5px;line-height:1.35}
.cbx{display:flex;align-items:center;gap:8px;font-weight:500;padding-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 18px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.seg.qtype button{padding:7px 12px;white-space:nowrap}
.seg .cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--sunk);color:var(--muted);font-size:12px;margin-left:4px}
.seg button[aria-pressed=true] .cnt{background:rgba(255,255,255,.25);color:inherit}
.tipw{position:relative;display:inline-flex}
.tipw[data-tip=""]::after{display:none}
.tipw.tipl::after{right:auto;left:0}
.tipw.tipl{cursor:help}
tr:nth-last-child(-n+2) .tipw::after{top:auto;bottom:calc(100% + 8px)}
.chip.hasinfo i{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:rgba(0,0,0,.14);font-size:10.5px;font-style:italic;font-family:Georgia,serif;margin-left:3px;vertical-align:1px}
.tipw::after{content:attr(data-tip);position:absolute;right:0;top:calc(100% + 8px);z-index:30;width:max-content;max-width:340px;white-space:pre-line;text-align:left;background:var(--ink);color:var(--surface);font-size:13px;font-weight:500;line-height:1.5;padding:9px 12px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;pointer-events:none;transform:translateY(-4px);transition:opacity .12s,transform .12s}
.tipw:hover::after,.tipw:focus-within::after,.tipw:focus::after{opacity:1;transform:none}
.tipw .btn[disabled]{pointer-events:none;cursor:not-allowed}
.tipw:has([disabled]){cursor:not-allowed}
.pickrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.pickrow>.lbl{width:96px;flex:none}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.pick button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.pick .cnt{font-size:11px;color:var(--muted)}
.plist{max-height:320px;overflow:auto;border-top:1px solid var(--line)}
.plist label{display:flex;gap:12px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.plist label:hover{background:var(--sunk)}
.plist .cnt{font-size:12px;color:var(--muted);font-weight:500}
.grp{border-bottom:1px solid var(--line)}
.grph{display:flex;align-items:center;gap:12px;padding:0 16px}
.grph .exp{flex:1;display:flex;align-items:center;gap:8px;border:0;background:none;padding:12px 0;text-align:left;min-width:0}
.grph .exp:hover b{color:var(--accent)}
.chev{color:var(--muted);transition:transform .15s}
.exp[aria-expanded=true] .chev,.picked[open] .chev{transform:rotate(180deg)}
.grpm{background:var(--sunk);display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));padding:4px 0}
.plist .grpm label,.grpm label{display:flex;gap:10px;align-items:center;padding:7px 16px 7px 44px;border-bottom:0;cursor:pointer}
.grpm label:hover{background:var(--accent-soft)}
.picked{border-top:1px solid var(--line)}
.picked summary{display:flex;align-items:center;gap:8px;padding:12px 16px;cursor:pointer;list-style:none}
.picked summary::-webkit-details-marker{display:none}
.ptable{width:100%;min-width:0}

// ================= ĐỒNG BỘ VỚI GOOGLE SHEET =================
// Mỗi lần giao diện vẽ lại, so dữ liệu với lần lưu trước và chỉ gửi phần thay đổi lên máy chủ.
const API={token:null,snap:{},queue:[],timer:null,busy:false,again:false,lastLoad:0};
const COLLS={users:[users,'id'],periods:[periods,'id'],library:[library,'id'],assigns:[assigns,'id'],items:[items,'id'],history:[history,'id'],reminders:[reminders,'id'],ratings:[ratings],reports:[reports],plans:[plans],settings:[settings]};
const entriesOf=c=>{const [ref,key]=COLLS[c];return key?ref.map(r=>[r[key],r]):Object.keys(ref).map(k=>[k,ref[k]]);};
function takeSnap(){API.snap={};for(const c in COLLS){const m={};entriesOf(c).forEach(([k,v])=>m[k]=JSON.stringify(v));API.snap[c]=m;}}
function diffChanges(){const out=[];for(const c in COLLS){const old=API.snap[c]||(API.snap[c]={}),seen={};
  entriesOf(c).forEach(([k,v])=>{const j=JSON.stringify(v);seen[k]=1;if(old[k]!==j){out.push({c,k,v});old[k]=j;}});
  Object.keys(old).forEach(k=>{if(!seen[k]){out.push({c,k,v:null});delete old[k];}});}return out;}
// Chạy trong Google: dùng google.script.run. Chạy ở trang cổng vào (GitHub Pages): gọi cửa API qua fetch, không kèm tài khoản Google.
const call=(fn,...args)=>{
  if(window.google&&google.script&&google.script.run)return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
  if(!window.KPI_API)return Promise.reject(new Error('Không kết nối được máy chủ.'));
  const body=JSON.stringify({fn,args});
  return fetch(window.KPI_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body,credentials:'omit',redirect:'follow',keepalive:body.length<60000})
    .then(r=>{if(!r.ok)throw new Error('Máy chủ trả lỗi '+r.status);return r.json();})
    .then(j=>{if(!j.ok)throw new Error(j.error);return j.result;});};
function setSave(t,bad){const el=document.getElementById('savestate');if(el){el.textContent=t;el.className='savestate'+(bad?' bad':'');}API.saveText=t;API.saveBad=bad;}
function scheduleSync(ms=500){if(!API.token)return;clearTimeout(API.timer);API.timer=setTimeout(flushSync,ms);}
function flushSync(){if(!API.token)return Promise.resolve();
  if(API.busy){API.again=true;return API.busyP;}
  API.queue.push(...diffChanges());if(!API.queue.length)return Promise.resolve();
  const batch=API.queue.splice(0);API.busy=true;setSave('Đang lưu…');
  API.busyP=call('saveChanges',API.token,batch).then(r=>{API.busy=false;setSave('Đã lưu '+nowISO().slice(11));
      if(r&&r.rejected)console.warn('Máy chủ bỏ qua '+r.rejected+' thay đổi không đủ quyền.');
      if(API.again){API.again=false;return flushSync();}})
    .catch(e=>{API.busy=false;API.queue.unshift(...batch);
      if(sessionLost(e))return;setSave('Chưa lưu được, đang thử lại…',true);setTimeout(flushSync,10000);});
  return API.busyP;}
function sessionLost(e){if(!String(e&&e.message||e).includes('SESSION'))return false;
  clearSession();S.user=null;S.loginErr='Phiên đăng nhập đã hết hạn. Đăng nhập lại.';render();return true;}
function applyData(d){
  if(d.now)SKEW=d.now-Date.now();DEFAULT_PW=d.defaultPw||'';
  for(const k of Object.keys(settings))delete settings[k];Object.assign(settings,{base:40,lockDay:5,okrMin:1.5,okrMax:5,tos:[],cvs:[],phuTrach:{}},d.settings||{});
  ['base','lockDay','okrMin','okrMax'].forEach(k=>settings[k]=Number(settings[k]));
  if(!Array.isArray(settings.tos))settings.tos=[];if(!Array.isArray(settings.cvs))settings.cvs=[];if(!settings.phuTrach||typeof settings.phuTrach!=='object')settings.phuTrach={};
  for(const c of ['users','periods','library','assigns','items','history','reminders']){const ref=COLLS[c][0];ref.splice(0,ref.length,...(d[c]||[]));}
  for(const c of ['ratings','reports','plans']){const ref=COLLS[c][0];for(const k of Object.keys(ref))delete ref[k];Object.assign(ref,d[c]||{});}
  users.forEach(u=>{if(!Array.isArray(u.approvers))u.approvers=[];});
  assigns.forEach(a=>{if(!Array.isArray(a.periods))a.periods=[];if(!Array.isArray(a.recipients))a.recipients=[];});
  Object.values(reports).forEach(r=>{if(!Array.isArray(r.nx))r.nx=['Không.','','Không.','','Không.','Không.','Không.'];});
  Object.values(plans).forEach(p=>{if(!Array.isArray(p.dk))p.dk=[...DK_DEFAULT];});
  periods.sort((a,b)=>a.id<b.id?-1:1);history.sort((a,b)=>a.at<b.at?1:-1);
  takeSnap();API.lastLoad=Date.now();}

// ================= TÍNH ĐIỂM =================
// Điểm phẩm chất, đạo đức, lối sống, uy tín: mặc định mọi cán bộ được đủ 30 điểm. Tổng điểm = 30 + KPI + OKR.
// Đề xuất xếp loại vẫn xét theo KPI + OKR (mốc 40 và 60), tức tổng điểm mốc 70 và 90.
const PC=30;
// Điểm TB = Điểm chuẩn (40) ÷ số KPI (được giao + tự đăng ký).
// Điểm KPI = 40 + TB × số KPI phát sinh hoàn thành − 2 × TB × số KPI không hoàn thành − TB/3 × số KPI không đảm bảo tiến độ; thấp nhất 0.
// Điểm OKR = Σ (hệ số 1,5–5 × TB) cho mỗi OKR hoàn thành; OKR không hoàn thành không bị trừ.
function calc(uid,p){
  const its=items.filter(i=>i.owner===uid&&i.period===p);
  const base=its.filter(i=>i.type==='KPI'&&i.src!=='ps');
  const n=base.length,tb=n?settings.base/n:0;
  const done=base.filter(i=>i.status==='duyet'),miss=base.filter(i=>i.status==='khongdat');
  const left=base.length-done.length-miss.length;
  const ps=its.filter(i=>i.src==='ps'&&i.status==='duyet').length;
  const okr=its.filter(i=>i.type==='OKR'&&i.status==='duyet');
  const cham=its.filter(i=>i.type==='KPI'&&i.status==='duyet'&&i.cham).length;
  const raw=n?settings.base+tb*ps-2*tb*miss.length-tb/3*cham:0;
  const okrPts=okr.reduce((s,i)=>s+i.coef*tb,0);
  return {n,tb,giao:base.filter(i=>i.src==='giao').length,dk:base.filter(i=>i.src==='dk').length,
    done:done.length,dat:its.filter(i=>i.type==='KPI'&&i.status==='duyet'&&i.level!=='vuot').length,vuot:its.filter(i=>i.type==='KPI'&&i.status==='duyet'&&i.level==='vuot').length,miss:miss.length,left,ps,cham,
    okrN:okr.length,coefs:okr.map(i=>i.coef),kpi:Math.max(0,raw),okr:okrPts,total:Math.max(0,raw)+okrPts,pc:PC,all:PC+Math.max(0,raw)+okrPts,worst:Math.max(0,raw-2*tb*left)};
}
const itemPts=i=>{const t=calc(i.owner,i.period).tb;
  if(i.type==='OKR')return i.status==='duyet'?i.coef*t:0;
  const late=i.status==='duyet'&&i.cham?t/3:0;
  if(i.src==='ps')return i.status==='duyet'?t-late:0;
  return i.status==='khongdat'?-2*t:-late;};
const signed=v=>v>0?'+'+num(v):v<0?'−'+num(-v):'0';
function propose(c){
  if(c.kpi<40)return c.okrN?{code:'HTT',note:'KPI dưới 40 nhưng có OKR: đề xuất nâng 1 mức (nếu thuộc tiêu chí Không hoàn thành thì nâng lên Hoàn thành nhiệm vụ)'}
    :{code:'HTNV',note:'KPI dưới 40: Hoàn thành nhiệm vụ hoặc Không hoàn thành nhiệm vụ, quản lý xem xét theo tiêu chí'};
  if(c.total>=60)return c.okrN?{code:'HTXS',note:'KPI + OKR từ 60 điểm và có OKR hoàn thành; cần đảm bảo các tiêu chí khác'}:{code:'HTT',note:'KPI + OKR từ 60 điểm nhưng chưa có OKR hoàn thành nên chưa đủ điều kiện xuất sắc'};
  return {code:'HTT',note:'KPI + OKR từ 40 đến 59 điểm'};
}
const finalRating=(uid,p)=>ratings[p+'|'+uid]||propose(calc(uid,p)).code;
function ratio(p){
  const ev=users.filter(u=>u.evaluated&&u.active),r=ev.map(u=>({u,f:ratings[p+'|'+u.id]||''}));
  const good=r.filter(x=>x.f==='HTT'||x.f==='HTXS'),xs=r.filter(x=>x.f==='HTXS');
  const phoGood=good.filter(x=>x.u.cv==='Phó'),phoXS=xs.filter(x=>x.u.cv==='Phó');
  const rr=v=>v>0&&v<1?1:Math.round(v);
  return {ev:ev.length,chosen:r.filter(x=>x.f).length,good:good.length,xs:xs.length,capXS:Math.floor(good.length*0.25),
    phoGood:phoGood.length,phoXS:phoXS.length,capPho:rr(phoGood.length*0.25),capGood:Math.floor(ev.length*0.9)};
}

function navGroups(u){const g=[];

const RTS={HTXS:'Xuất sắc',HTT:'Tốt',HTNV:'Hoàn thành NV',KHT:'Không HT'};
function overview(){
  const u=me(),p=S.period,c=calc(u.id,p),fr=finalRating(u.id,p),open=isOpen(p),chosen=ratings[p+'|'+u.id];
  const mine=items.filter(i=>i.owner===u.id&&i.period===p),cnt=fn=>mine.filter(fn).length;
  const st={chua:cnt(i=>i.status==='chua'&&!i.reason),tralai:cnt(i=>i.status==='chua'&&i.reason),cho:cnt(i=>i.status==='cho'||i.status==='xinxoa'),
    duyet:cnt(i=>i.status==='duyet'),vuot:cnt(i=>i.status==='duyet'&&i.level==='vuot'),khong:cnt(i=>i.status==='khongdat'),
    ps:cnt(i=>i.src==='ps'),okr:cnt(i=>i.type==='OKR')};
  const max=Math.max(110,Math.ceil((c.all+10)/10)*10),pos=v=>Math.min(100,v/max*100);
  let hint;
  if(c.kpi<40)hint=`Điểm KPI đang dưới 40: còn thiếu ${num(40-c.kpi)} điểm để đạt mức Hoàn thành tốt.${c.okrN?' Có OKR hoàn thành nên có thể được xét nâng 1 mức.':''}`;
  else if(c.total<60)hint=`Cần thêm ${num(60-c.total)} điểm${c.okrN?'':' và ít nhất 1 OKR hoàn thành'} để được xét Hoàn thành xuất sắc.`;
  else hint=c.okrN?'Đã đủ điểm và có OKR hoàn thành: đủ điều kiện điểm để được xét Hoàn thành xuất sắc.':'Đã đủ 60 điểm KPI + OKR. Cần ít nhất 1 OKR hoàn thành để được xét Hoàn thành xuất sắc.';
  const [y,m]=p.split('-').map(Number),today=nowISO().slice(0,10),end=`${p}-${pad(new Date(y,m,0).getDate())}`;
  const daysLeft=Math.round((Date.parse(end)-Date.parse(today))/864e5);
  const timeline=!open?'Tháng đã chốt':today<`${p}-01`?`Kỳ bắt đầu ${fmt(p+'-01')}`:daysLeft<0?'Đã hết tháng, chờ chốt':daysLeft===0?'Hôm nay là ngày cuối tháng':`Còn ${daysLeft} ngày đến cuối tháng`;
  const tile=(lbl,v,sub,go,f,cls='')=>`<button class="tile ${cls}" data-act="goto" data-v="${go}" data-f="${f}"><span class="lbl">${lbl}</span><span class="v">${v}</span><span class="s">${sub}</span></button>`;
  const base=mine.filter(i=>i.type==='KPI'&&i.src!=='ps'),bc=s=>base.filter(i=>s.includes(i.status)).length;
  const seg=[['duyet','Hoàn thành',bc(['duyet'])],['cho','Chờ duyệt',bc(['cho','xinxoa'])],['chua','Đang thực hiện',bc(['chua'])],['khongdat','Không hoàn thành',bc(['khongdat'])]];
  const todo=open?mine.filter(i=>i.status==='chua').sort((a,b)=>(b.reason?1:0)-(a.reason?1:0)||(a.src==='giao'?-1:1)).slice(0,6):[];
  const recent=items.filter(i=>i.owner===u.id&&(i.status==='duyet'||i.status==='khongdat')&&i.approvedAt).sort((a,b)=>a.approvedAt<b.approvedAt?1:-1).slice(0,5);
  const hist=periods.filter(x=>`${x.id}-01`<=today).map(x=>({p:x.id,open:x.state==='open',c:calc(u.id,x.id),f:finalRating(u.id,x.id)})).filter(x=>x.c.n||x.c.okrN);
  const hmax=Math.max(90,...hist.map(h=>h.c.all));
  const goOf=i=>i.type==='OKR'?'okr':i.src==='ps'?'ps':'kpi';
  const myRem=reminders.filter(r=>r.uid===u.id&&!r.seen);
  return `${myRem.length?`<div class="remind-banner" role="status"><div><b>Nhắc nhở từ ${esc(uObj(myRem.at(-1).by)?.name||'quản lý')}</b> · ${fmt(myRem.at(-1).at)}<div>${esc(myRem.at(-1).text)}</div></div><button class="btn sm" data-act="rem-seen">Đã xem</button></div>`:''}
  <div class="head"><h2>Tổng quan · ${pLabel(p)}</h2><p>Xin chào ${esc(u.name)}. ${timeline}.</p></div>
  <section class="panel hero">
    <div class="hl">
      <span class="lbl">Tổng điểm tháng${open?' · tạm tính':''}</span>
      <div class="big">${num(c.all)}</div>
      <div class="eq">Phẩm chất <b>${num(c.pc)}</b> + KPI <b>${num(c.kpi)}</b> + OKR <b>${num(c.okr)}</b></div>
      <div class="rt"><span class="chip c-${fr}">${RT[fr]}</span><span class="sub" style="margin:0">${chosen?'Quản lý đã xếp loại':'Dự kiến, quản lý chốt cuối tháng'}</span></div>
    </div>
    <div class="hr">
      <div class="scale" role="img" aria-label="Tổng ${num(c.all)} điểm, mốc ${PC+40} và ${PC+60}">
        <div class="track"><i style="width:${pos(c.all)}%"></i></div>
        <span class="mk" style="left:${pos(PC+40)}%"><span><b>${PC+40}</b><em> Hoàn thành tốt</em></span></span>
        <span class="mk" style="left:${pos(PC+60)}%"><span><b>${PC+60}</b><em> Xuất sắc</em></span></span>
      </div>
      <p class="hint">${hint}</p>
      ${c.left&&open?`<p class="warnline">Còn ${c.left} KPI chưa hoàn thành. Hết tháng chưa báo hoàn thành thì tự chuyển Không hoàn thành, mỗi việc bị trừ ${num(2*c.tb)} điểm.</p>`:''}
    </div>
  </section>
  <section class="tiles" aria-label="Trạng thái công việc">
    ${tile('Đang thực hiện',st.chua,'Chưa báo hoàn thành','kpi','chua')}
    ${tile('Bị trả lại',st.tralai,st.tralai?'Cần bổ sung, gửi lại':'Không có','kpi','chua',st.tralai?'alert':'')}
    ${tile('Chờ duyệt',st.cho,'Đã báo, chờ quản lý','kpi','cho',st.cho?'tw':'')}
    ${tile('Đã hoàn thành',st.duyet,`${st.vuot} vượt chỉ tiêu${c.cham?` · ${c.cham} chậm tiến độ (−${num(c.tb/3*c.cham)} điểm)`:''}`,'kpi','duyet','tg')}
    ${tile('Không hoàn thành',st.khong,c.miss?`Bị trừ ${num(2*c.tb*c.miss)} điểm`:'Không bị trừ điểm','kpi','khongdat',st.khong?'alert':'tb0')}
    ${tile('KPI phát sinh',`${c.ps}/${st.ps}`,`Được cộng ${num(c.tb*c.ps)} điểm`,'ps','all','tp')}
    ${tile('OKR',`${c.okrN}/${st.okr}`,`Được cộng ${num(c.okr)} điểm`,'okr','all','tm')}
    ${tile('Điểm TB',c.n?num(c.tb):'—',`${num(settings.base)} ÷ ${c.n} KPI`,'kpi','all','tp')}
  </section>
  <div class="grid2">
    <section class="panel"><div class="toolbar"><h3 class="h3">KPI tháng này</h3><div class="spacer"></div><span class="sub" style="margin:0">${c.n} việc · ${c.giao} được giao, ${c.dk} tự đăng ký</span></div>
      <div class="pad stack">
        ${c.n?`<div class="segbar">${seg.filter(s=>s[2]).map(s=>`<i class="sb-${s[0]}" style="flex:${s[2]}" title="${s[1]}: ${s[2]}"></i>`).join('')}</div>
        <div class="legend">${seg.map(s=>`<span><i class="sb-${s[0]}"></i>${s[1]} <b>${s[2]}</b></span>`).join('')}</div>`:'<div class="sub">Chưa có KPI nào trong kỳ.</div>'}
      </div>
      <div class="toolbar" style="border-top:1px solid var(--line)"><h3 class="h3">Việc cần làm</h3></div>
      <ul class="todo">${todo.map(i=>`<li><div><div>${esc(i.text)}</div><div class="sub">${i.type==='OKR'?'OKR':i.src==='ps'?'KPI phát sinh':'KPI'} · ${SRC[i.src]}${i.reason?` · <span class="neg">Bị trả lại: ${esc(i.reason)}</span>`:''}</div></div><button class="btn sm" data-act="goto" data-v="${goOf(i)}" data-f="chua">Mở</button></li>`).join('')||`<li class="sub">${open?'Không còn việc nào đang dở.':'Tháng đã chốt.'}</li>`}</ul>
    </section>
    <div class="stack" style="gap:20px">
      <section class="panel"><div class="toolbar"><h3 class="h3">Điểm các tháng</h3></div>
        <ul class="mbars">${hist.map(h=>`<li><span class="ml">${pLabel(h.p).replace('Tháng ','T')}${h.open?'<small>tạm tính</small>':''}</span><span class="mt"><i style="width:${h.c.all/hmax*100}%"></i></span><b>${num(h.c.all)}</b><span class="chip c-${h.f}">${RTS[h.f]}</span></li>`).join('')||'<li class="sub">Chưa có dữ liệu.</li>'}</ul></section>
      <section class="panel"><div class="toolbar"><h3 class="h3">Duyệt gần đây</h3></div>
        <ul class="todo">${recent.map(i=>{const v=itemPts(i);return `<li><div><div>${esc(i.text)}</div><div class="sub">${fmt(i.approvedAt)} · ${esc(uObj(i.approvedBy)?.name||i.approvedBy)}</div></div><div class="n">${statusCell(i)}${v?`<div class="${v<0?'neg':''}" style="font-weight:600">${signed(v)}</div>`:''}</div></li>`;}).join('')||'<li class="sub">Chưa có.</li>'}</ul></section>

function mine(v){

      <div class="t-ps"><span class="lbl">Điểm mỗi việc</span><span class="v">${k.n?num(k.tb):'—'}</span><span class="s">Bằng điểm TB của KPI</span></div>
      <div class="t-main"><span class="lbl">Điểm cộng thêm</span><span class="v big">+${num(k.ps*k.tb)}</span><span class="s">Đã tính vào điểm KPI</span></div>
    </section>`;}

      <div class="t-n"><span class="lbl">Điểm chuẩn</span><span class="v">${num(settings.base)}</span><span class="s">Làm đủ số KPI được ${num(settings.base)}</span></div>
      <div class="t-info"><span class="lbl">Số KPI</span><span class="v">${k.n}</span><span class="s">${k.giao} được giao · ${k.dk} tự đăng ký</span></div>
      <div class="t-ps"><span class="lbl">Điểm TB</span><span class="v">${k.n?num(k.tb):'—'}</span><span class="s">${k.n?`${num(settings.base)} ÷ ${k.n}`:'Chưa có KPI'}</span></div>
      <div class="${k.miss?'t-bad':k.n&&k.done===k.n?'t-good':'t-warn'}"><span class="lbl">Kết quả</span><span class="v">${k.done}/${k.n}</span><span class="s">${k.miss} không hoàn thành · ${k.ps} phát sinh</span></div>
      <div class="t-main"><span class="lbl">Điểm KPI</span><span class="v big">${num(k.kpi)}</span><span class="s">${!open?'Đã chốt tháng':k.left?`Nếu ${k.left} việc còn lại không xong: ${num(k.worst)}`:'Tạm tính'}</span></div>
    </section>`;
  else strip=`<section class="score s4" aria-label="Điểm OKR">
      <div class="t-info"><span class="lbl">Số OKR</span><span class="v">${listOf('okr',u.id,p).length}</span><span class="s">Được giao và tự đăng ký</span></div>
      <div class="${k.okrN?'t-good':'t-warn'}"><span class="lbl">OKR hoàn thành</span><span class="v">${k.okrN}</span><span class="s">${k.coefs.length?'Hệ số '+k.coefs.map(num).join(' · '):'Chưa có'}</span></div>
      <div class="t-ps"><span class="lbl">Điểm TB</span><span class="v">${k.n?num(k.tb):'—'}</span><span class="s">Căn cứ để quản lý chấm</span></div>
      <div class="t-main"><span class="lbl">Điểm OKR</span><span class="v big">${num(k.okr)}</span><span class="s">Σ hệ số × điểm TB</span></div>
    </section>`;
  const lockNote=v==='kpi'&&open?(regLocked(p)
    ?`<div class="notice">Đã qua ngày chốt đăng ký (${fmt(lockDate(p))}). Không thêm hoặc xóa KPI tự đăng ký; muốn xóa thì gửi đề nghị để quản lý đồng ý. Việc làm thêm nhập ở <b>KPI phát sinh</b>.</div>`
    :''):'';
  const libOpts=library.filter(t=>t.type===c.type).map(t=>`<option value="${t.id}">${esc(t.group)} · ${esc(t.text)}</option>`).join('');
  const fd=ed||S.itemD[v],addTitle=v==='kpi'?'Thêm KPI tự đăng ký':v==='ps'?'Thêm KPI phát sinh':'Thêm OKR tự đăng ký';

    ${open?'':`<div class="notice">${pLabel(p)} đã chốt. Chỉ xem, không sửa được.</div>`}
    ${strip}${lockNote}
    ${v==='ps'&&!k.n?`<div class="notice">Chưa có KPI được giao hoặc tự đăng ký trong kỳ nên KPI phát sinh chưa có điểm.</div>`:''}
    ${S.itemOpen===v||ed?`<div class="ov" data-act="item-close-ov"><form class="modal md mxl panel pad stack" id="f-item" data-v="${v}" role="dialog" aria-modal="true" aria-labelledby="it-h">
      <div class="mhead"><h3 class="h3" id="it-h">${ed?`Sửa ${c.title}`:addTitle}${!ed&&S.itemWas?'<span class="chip c-cho" style="margin-left:6px">Mở lại bản nháp</span>':''}</h3><button class="btn ghost sm" type="button" data-act="item-close" aria-label="Đóng">✕</button></div>
      <div class="field sugwrap"><label for="it-text">Nội dung</label><input type="text" id="it-text" data-sug="${c.type}" autocomplete="off" required placeholder="Gõ nội dung, hoặc gõ vài chữ để chọn đầu việc mẫu" value="${fd?esc(fd.text||''):''}"><div class="sugbox" id="sug-it-text" hidden></div></div>
      <div class="field"><label for="it-ct">Chỉ tiêu / kết quả phải đạt</label><input type="text" id="it-ct" placeholder="Ví dụ: 05 hồ sơ, xong trước 25/10" value="${fd?esc(fd.chiTieu||''):''}"></div>
      ${v==='ps'?'':`<div class="field"><label for="it-sp">Sản phẩm đầu ra dự kiến</label><input type="text" id="it-sp" placeholder="Ví dụ: 05 biên bản" value="${fd?esc(fd.spDuKien||''):''}"></div>
      <div class="field"><label for="it-yc">${c.type==='OKR'?'Yêu cầu chất lượng, hiệu quả':'Yêu cầu chất lượng, tiến độ'}</label><input type="text" id="it-yc" value="${fd?esc(fd.yeuCau??'Trong tháng'):'Trong tháng'}"></div>`}
      <div class="row" style="justify-content:flex-end;gap:8px">${!ed&&S.itemD[v]?'<button class="btn ghost" type="button" data-act="item-discard" style="margin-right:auto">Xóa nháp</button>':''}<button class="btn ghost" type="button" data-act="item-close">${ed?'Hủy':'Đóng, lưu nháp'}</button><button class="btn pri" type="submit">${ed?'Lưu thay đổi':'Thêm'}</button></div>
    </form></div>`:''}
    <section class="panel">
      <div class="toolbar">
        <input type="search" class="search" id="q-${v}" placeholder="Tìm nhanh theo nội dung…" value="${esc(S.q[v])}" aria-label="Tìm">
        <select id="flt-${v}" aria-label="Lọc trạng thái">${[['chua','Đang thực hiện'],['cho','Chờ duyệt'],['duyet','Đã hoàn thành'],['khongdat','Không hoàn thành'],['all','Tất cả']].map(([k,l])=>`<option value="${k}" ${S.filter[v]===k?'selected':''}>${l}</option>`).join('')}</select>
        <div class="spacer"></div>
        <div class="row" id="bw-${v}" style="gap:6px;align-items:center" hidden><span class="sub" id="bwn-${v}" style="margin:0"></span>
        <select id="bulk-lv" aria-label="Mức hoàn thành"><option value="dat">Đạt chỉ tiêu</option><option value="vuot">Vượt chỉ tiêu</option>${VC[v].type==='KPI'?'<option value="cham">Không đảm bảo tiến độ</option>':''}</select>
        <button class="btn pri" data-act="bulk-done" data-v="${v}" id="bulk-${v}">Báo hoàn thành</button></div>
      </div>
      <div id="list">${mineList(v)}</div>
    </section>`;
}
function mineList(v){

  let its=listOf(v,u.id,p);
  const fv=S.filter[v];if(fv!=='all')its=its.filter(i=>fv==='cho'?(i.status==='cho'||i.status==='xinxoa'):i.status===fv);
  if(q)its=its.filter(i=>norm(i.text).includes(q));
  const ORD={chua:0,xinxoa:1,cho:2,khongdat:3,duyet:4};its=its.slice().sort((a,b)=>ORD[a.status]-ORD[b.status]);
  const selectable=its.filter(i=>i.status==='chua'&&isOpen(p)),nSel=selectable.filter(i=>S.sel.has(i.id)).length;
  queueMicrotask(()=>{const w=$('#bw-'+v);if(w)w.hidden=!nSel;const n=$('#bwn-'+v);if(n)n.textContent=`Đã chọn ${nSel} việc:`;});
  if(!its.length)return `<div class="empty">${q?'Không có mục nào khớp từ khóa.':S.filter[v]!=='all'?'Không có mục nào ở trạng thái này. Chọn "Tất cả" để xem các mục khác.':'Chưa có mục nào trong kỳ này.'}</div>`;
  return `<div class="tw"><table class="mytbl"><thead><tr>

    ${its.map(i=>{
      let acts='',links='';const open=isOpen(p);
      if(i.status==='chua'&&open){
        if(S.confirmDel===i.id)acts=`<span class="sub" style="margin:0">Xóa mục này?</span><button class="btn sm bad" data-act="del-yes" data-id="${i.id}">Xóa</button><button class="btn sm ghost" data-act="del-no">Hủy</button>`;
        else{acts=`<button class="btn sm good" data-act="done" data-lv="dat" data-id="${i.id}">Đạt chỉ tiêu</button><button class="btn sm good" data-act="done" data-lv="vuot" data-id="${i.id}">Vượt chỉ tiêu</button>${i.type==='KPI'?`<button class="btn sm warn" data-act="done" data-lv="cham" data-id="${i.id}" title="Hoàn thành nhưng chậm so với yêu cầu: trừ ${num(t/3)} điểm nếu được duyệt">Không đảm bảo tiến độ</button>`:''}${i.src!=='ps'?`<button class="btn sm bad" data-act="selfmiss" data-id="${i.id}">Không hoàn thành</button>`:''}`;
          if(canEdit(i))links+=`<button class="lnk" data-act="edit" data-id="${i.id}">Sửa</button>`;
          if(canDelete(i))links+=`<button class="lnk" data-act="del" data-id="${i.id}">Xóa</button>`;
          if(canAskDelete(i))links+=`<button class="lnk" data-act="askdel" data-id="${i.id}">Đề nghị xóa</button>`;}
      }else if(i.status==='khongdat'&&i.selfMiss&&open&&!monthEnded(p))acts=`<button class="btn sm ghost" data-act="undo-selfmiss" data-id="${i.id}">Hoàn tác</button>`;
      else if(i.status==='xinxoa'&&open)acts=`<button class="btn sm ghost" data-act="undo-askdel" data-id="${i.id}">Rút đề nghị xóa</button>`;
      else acts=`<span class="sub" style="margin:0">${i.status==='cho'?'Chờ quản lý duyệt':''}</span>`;
      const pts=itemPts(i),dec=i.status==='duyet'||i.status==='khongdat';
      return `<tr class="st-${i.status==='chua'&&i.reason?'tralai':i.status}"><td class="cb">${i.status==='chua'&&open?`<input type="checkbox" data-act="sel" data-id="${i.id}" ${S.sel.has(i.id)?'checked':''} aria-label="Chọn">`:''}</td>
        <td class="job"><div class="jt">${esc(i.text)}</div>${i.chiTieu?`<div class="sub">Chỉ tiêu: ${esc(i.chiTieu)}</div>`:''}${i.reason?`<div class="why">${i.status==='khongdat'?'Lý do':'Lý do trả lại'}: ${esc(i.reason)}</div>`:''}
          <div class="meta"><span class="chip ${i.src==='giao'?'c-giao':i.src==='ps'?'c-ps':'c-dk'}">${SRC[i.src]}</span><span>Nhập ${fmtD(i.created)}</span>${links}</div></td>
        <td>${statusCell(i)}${dec?`<div class="sub">${i.approvedBy==='Hệ thống'?'Tự chuyển':i.selfMiss?'Tự báo':'Duyệt'} ${fmtD(i.approvedAt)}</div>`:''}</td>
        <td class="n ${pts<0?'neg':''}"><b>${pts?signed(pts):'—'}</b></td><td><div class="acts">${acts}</div></td></tr>${S.missFor===i.id?missForm(i):''}`;}).join('')}
    </tbody></table></div>
    <p class="formula pad" style="margin:0;border-top:1px solid var(--line)">${VC[v].type==='KPI'?`Điểm KPI = ${num(settings.base)} + TB × số KPI phát sinh hoàn thành − 2 × TB × số KPI không hoàn thành − TB ÷ 3 × số KPI không đảm bảo tiến độ (thấp nhất 0). Điểm TB hiện tại: ${t?num(t):'—'}.`:'Điểm mỗi OKR = hệ số (1,5 – 5) × điểm TB. Tổng tháng = Điểm KPI + Điểm OKR.'}</p>`;
}

function missForm(i){const pen=i.type==='KPI'?`Bị trừ ${num(2*calc(i.owner,i.period).tb)} điểm.`:'OKR không hoàn thành không bị trừ điểm.';

  <p class="formula" style="margin:0;flex:1 1 200px">${pen} Có thể hoàn tác trước khi hết tháng.</p>
  <button class="btn bad" type="submit">Xác nhận không hoàn thành</button><button class="btn ghost" type="button" data-act="selfmiss-cancel">Hủy</button></form></td></tr>`;}
// ================= CHỜ DUYỆT =================
const coefOf=i=>S.coef[i.id]??'1.5';
const validCoef=v=>{const x=parseFloat(String(v).replace(',','.'));return !isNaN(x)&&x>=settings.okrMin-1e-9&&x<=settings.okrMax+1e-9&&Math.abs(x*10-Math.round(x*10))<1e-6?Math.round(x*10)/10:null;};

    <section class="panel">
      <div class="toolbar">
        <input type="search" class="search" id="q-duyet" placeholder="Tìm theo tên cán bộ hoặc nội dung…" value="${esc(S.q.duyet)}" aria-label="Tìm mục chờ duyệt">
        ${(()=>{const all=queue(),n=k=>all.filter(QT[k]).length;return `<div class="seg qtype" role="group" aria-label="Lọc theo loại">${[['all','Tất cả'],['kpi','KPI'],['ps','KPI phát sinh'],['okr','OKR']].map(([k,l])=>`<button type="button" data-act="qtype" data-v="${k}" aria-pressed="${S.qType===k}">${l} <span class="cnt">${n(k)}</span></button>`).join('')}</div>`;})()}
        <div class="spacer"></div>
        <span class="tipw" tabindex="0" id="tip-duyet" data-tip="Tích chọn ít nhất 1 mục trong danh sách để duyệt hàng loạt."><button class="btn pri" data-act="bulk-approve" id="bulk-duyet">Duyệt mục đã chọn</button></span>
      </div>
      <div id="list">${approvalList()}</div>

    <section class="panel"><div class="toolbar"><h3 class="h3">Lịch sử duyệt gần đây</h3></div>
      <ul class="log">${history.slice(0,8).map(h=>`<li><b>${esc(h.action)}</b> · ${esc(h.text)} <span class="sub" style="display:inline">· của ${esc(uObj(h.owner)?.name||h.owner)} · bởi ${esc(h.by)} · ${fmt(h.at)}</span>${h.reason?`<div class="why">${esc(h.reason)}</div>`:''}</li>`).join('')||'<li class="sub">Chưa có thao tác.</li>'}</ul></section>`;
}
const QT={all:()=>true,kpi:i=>i.type==='KPI'&&i.src!=='ps',ps:i=>i.src==='ps',okr:i=>i.type==='OKR'};

    <th>Cán bộ</th><th>Nội dung</th><th>Loại</th><th class="n">Mức / Điểm</th><th class="n">Thao tác</th></tr></thead><tbody>
    ${its.map(i=>{const o=uObj(i.owner),self=i.owner===S.user,t=calc(i.owner,i.period).tb,r=S.reasonFor&&S.reasonFor.id===i.id?S.reasonFor:null;
      let cell,acts;
      if(i.status==='xinxoa'){cell='<span class="chip c-xinxoa">Đề nghị xóa</span><div class="sub">Xóa sẽ đổi số chia</div>';
        acts=`<button class="btn sm bad" data-act="delok" data-id="${i.id}">Đồng ý xóa</button><button class="btn sm" data-act="delno" data-id="${i.id}">Từ chối</button>`;}

          cell=`<select class="lvsel" data-act="lv" data-id="${i.id}" aria-label="Mức hoàn thành"><option value="dat" ${lv==='dat'?'selected':''}>Đạt chỉ tiêu</option><option value="vuot" ${lv==='vuot'?'selected':''}>Vượt chỉ tiêu</option></select>
            <select class="lvsel" data-act="cham" data-id="${i.id}" aria-label="Tiến độ" style="margin-top:4px">${[['0','Đảm bảo tiến độ'],['1','Không đảm bảo tiến độ']].map(([k,l])=>`<option value="${k}" ${(chamOf(i)?'1':'0')===k?'selected':''}>${l}</option>`).join('')}</select>

      return `<tr><td class="cb">${i.status==='cho'?`<input type="checkbox" data-act="qsel" data-id="${i.id}" ${S.qsel.has(i.id)?'checked':''} aria-label="Chọn">`:''}</td>
        <td><div>${esc(o.name)}</div>${self?'<span class="chip c-self">Tự duyệt</span>':`<div class="sub">${esc(o.to)} · ${esc(o.cv)}</div>`}</td>
        <td>${esc(i.text)}<div class="sub">${pLabel(i.period)} · ${SRC[i.src]} · nhập ${fmtD(i.created)}${i.doneAt?` · báo HT ${fmtD(i.doneAt)}`:''}</div></td>
        <td>${i.type==='OKR'?'<span class="chip c-okr">OKR</span>':i.src==='ps'?'<span class="chip c-ps">KPI phát sinh</span>':'<span class="chip c-dk">KPI</span>'}</td>
        <td class="n">${cell}</td><td><div class="acts">${acts}</div></td></tr>
        ${r?`<tr><td colspan="6" style="padding:0"><form class="reason" id="f-reason"><span class="lbl">${r.a==='tralai'?'Lý do trả lại':'Lý do không hoàn thành'}</span><input type="text" id="rs-text" required placeholder="${r.a==='tralai'?'Ví dụ: bổ sung hồ sơ rồi gửi lại':'Ví dụ: chưa đạt chỉ tiêu đã đăng ký'}"><button class="btn ${r.a==='tralai'?'':'bad'}" type="submit">${r.a==='tralai'?'Trả lại':'Xác nhận không hoàn thành'}</button><button class="btn ghost" type="button" data-act="reason-cancel">Hủy</button></form></td></tr>`:''}`;}).join('')}
    </tbody></table></div>`;
}
const chamOf=i=>i.type==='KPI'&&(S.cham[i.id]??!!i.cham);
function chamHint(i){const t=calc(i.owner,i.period).tb,c=chamOf(i);
  return i.src==='ps'?`Duyệt: +${num(c?t-t/3:t)}`:c?`<span class="neg">Duyệt: −${num(t/3)}</span> · Không HT: −${num(2*t)}`:`Không HT: −${num(2*t)}`;}
function approveOne(i){
  if(i.type==='KPI'){const c=chamOf(i);if(c!==!!i.cham)i._chamChg=c?'Đảm bảo → Không đảm bảo tiến độ':'Không đảm bảo → Đảm bảo tiến độ';else i._chamChg='';i.cham=c;delete S.cham[i.id];}
  if(i.type==='OKR'){const v=validCoef(coefOf(i));if(v===null)return false;i.coef=v;i.level=S.lv[i.id]??i.level??'dat';}
  else{const lv=S.lv[i.id]??i.level??'dat';if(i.level&&lv!==i.level)i.reason='';i._changed=i.level&&lv!==i.level?`${LV[i.level]} → ${LV[lv]}`:'';i.level=lv;}
  i.status='duyet';i.reason='';i.approvedAt=nowISO();i.approvedBy=S.user;
  delete S.coef[i.id];delete S.lv[i.id];S.qsel.delete(i.id);
  log(i,i.type==='OKR'?`Duyệt OKR · hệ số ${num(i.coef)}`:`Duyệt KPI · ${LV[i.level]}${i.cham?' · Không đảm bảo tiến độ':''}${i._changed?` (sửa ${i._changed})`:''}${i._chamChg?` (sửa ${i._chamChg})`:''}`);delete i._chamChg;
  return true;
}
function log(i,action,reason=''){history.unshift({id:newId('h'),at:nowISO(),by:S.user,owner:i.owner,text:i.text,action:i.owner===S.user?action+' (tự duyệt)':action,reason});}

function ratioPanel(p){const r=ratio(p),all=r.chosen>=r.ev;

  return `<section class="checks" aria-label="Kiểm tra tỷ lệ">
    ${ck('Hoàn thành xuất sắc',r.xs,r.capXS,`25% của ${r.good} người từ Hoàn thành tốt trở lên`)}
    ${ck('Cấp Phó xuất sắc',r.phoXS,r.capPho,`25% của ${r.phoGood} cấp Phó từ Hoàn thành tốt trở lên, có làm tròn`)}
    ${ck('Từ Hoàn thành tốt trở lên',r.good,r.capGood,`90% của ${r.ev} cán bộ được đánh giá`,true)}

const evalUsers=()=>users.filter(u=>u.evaluated&&u.active);
const PK={giao:{mode:'to',filter:{to:'*',cv:'*'},q:''},pq:{mode:'to',filter:{to:'*',cv:'*'},q:''}};
const pkSel={giao:{has:id=>S.pick.has(id),set:(id,on)=>on?S.pick.add(id):S.pick.delete(id)},
  pq:{has:id=>uObj(id).approvers.includes(S.pqMgr),set:(id,on)=>{const u=uObj(id);u.approvers=u.approvers.filter(a=>a!==S.pqMgr);if(on)u.approvers.push(S.pqMgr);const m=uObj(S.pqMgr);if(m)m.role=users.some(x=>x.approvers.includes(m.id))?'ql':'cb';}}};
function pickPool(ns){const st=PK[ns],m=st.mode,f=st.filter[m];let ppl=evalUsers();
  if(m==='to'&&f!=='*')ppl=ppl.filter(u=>u.to===f);
  if(m==='cv'&&f!=='*')ppl=ppl.filter(u=>u.cv===f);
  const q=norm(st.q);if(q)ppl=ppl.filter(u=>norm(u.name+' '+u.id+' '+u.to+' '+u.cv).includes(q));return ppl;}
function pickControls(ns){const st=PK[ns];

    ${st.mode!=='nguoi'?`<div class="field" style="flex:0 1 220px"><label for="${ns}-filter">${st.mode==='to'?'Tổ':'Loại chức vụ'}</label><select id="${ns}-filter" data-ns="${ns}" data-pk="filter"><option value="*">Tất cả</option>${(st.mode==='to'?settings.tos:settings.cvs).filter(v=>evalUsers().some(u=>u[st.mode]===v)).map(v=>`<option ${st.filter[st.mode]===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`:''}
    <div class="field" style="flex:1 1 220px"><label for="${ns}-q">Tìm cán bộ</label><input type="search" id="${ns}-q" data-ns="${ns}" data-pk="q" placeholder="Gõ tên, tổ hoặc chức vụ…" value="${esc(st.q)}"></div>
  </div>`;}
function pickRows(ns,ppl,head,pre){const sel=pkSel[ns];
  queueMicrotask(()=>{const c=$('#pick-count');if(c)c.textContent=S.pick.size;const b=$('#btn-giao');if(b)b.disabled=!S.pick.size;const tg=$('#tip-giao');if(tg)tg.dataset.tip=S.pick.size?'':'Chọn ít nhất 1 người nhận để giao việc.';
    const pc=$('#pq-count');if(pc)pc.textContent=users.filter(u=>u.approvers.includes(S.pqMgr)).length;
    document.querySelectorAll('[data-ind="1"]').forEach(x=>x.indeterminate=true);});
  if(!ppl.length)return '<div class="empty">Không có cán bộ nào khớp.</div>';
  const n=ppl.filter(u=>sel.has(u.id)).length;
  return `<table class="ptable"><thead><tr><th class="cb">${head?`<input type="checkbox" data-act="pkset" data-ns="${ns}" ${n===ppl.length?'checked':''} data-ind="${n&&n<ppl.length?1:0}" aria-label="Chọn tất cả trong danh sách">`:''}</th><th>Họ tên ${head?`<span class="cnt">· đã chọn ${n}/${ppl.length}</span>`:''}</th><th>Tổ</th><th>Chức vụ</th></tr></thead><tbody>

async function renderDocx(b64,data,filename){
  if(!window.PizZip||!window.docxtemplater){toast('Chưa tải được thư viện tạo Word. Kiểm tra mạng rồi thử lại.');render();return;}
  try{await saveFile(filename,buildDocx(b64,data));}catch(e){console.error(e);toast('Không tạo được file Word: '+(e.message||e));render();}
}
// Mẫu, dữ liệu và tên file cho 2 loại văn bản: 'plan' = chương trình tháng, 'rep' = báo cáo tháng
function docJob(kind,uid,p){const [y,m]=p.split('-'),who=uid.replace(/\W/g,'');
  if(kind==='plan')return {b64:TPL2_B64,data:planData(uid,p),name:`CT_thang_${m}_${y}_${who}.docx`,title:'Chương trình công tác tháng'};
  const st=repState(uid,p),draft=st.pending||st.undone||isOpen(p);
  return {b64:TPL_B64,data:reportData(uid,p),name:`BC_thang_${m}_${y}_${who}${draft?'_NHAP':''}.docx`,title:'Báo cáo kết quả công tác tháng'+(draft?' (bản nháp)':'')};}
const exportPlan=(uid,p)=>{const j=docJob('plan',uid,p);return renderDocx(j.b64,j.data,j.name);};

// ================= XEM TRƯỚC BẢN IN =================
// Dựng đúng file Word sẽ tải về rồi hiển thị từng trang (thư viện docx-preview, tải khi cần)
const loadJs=src=>loadJs.p[src]||(loadJs.p[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;
  s.onerror=()=>{delete loadJs.p[src];s.remove();rej(new Error('Không tải được thư viện xem trước. Kiểm tra mạng rồi thử lại.'));};document.head.appendChild(s);}));
loadJs.p={};
function fitPreview(body){const w=body.querySelector('.docx-wrapper');if(!w)return;w.style.zoom=1;
  const need=Math.max(...[...w.querySelectorAll('section.docx')].map(s=>s.offsetWidth),0)+24,have=body.clientWidth-8;
  w.style.zoom=need>have?String(have/need):'1';}
function closePreview(){document.querySelector('.pvov')?.remove();window.removeEventListener('resize',closePreview.fit);}
async function previewDoc(kind,uid,p){
  if(!window.PizZip||!window.docxtemplater){toast('Chưa tải được thư viện tạo Word. Kiểm tra mạng rồi thử lại.');render();return;}
  closePreview();const j=docJob(kind,uid,p),ov=document.createElement('div');ov.className='pvov';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-label','Xem trước bản in');
  ov.innerHTML=`<div class="pvbar"><div style="flex:1 1 260px;min-width:0"><b>Xem trước bản in · ${esc(j.title)}</b><div class="sub" style="margin:0">Giống hệt file Word sẽ tải về. Muốn sửa nội dung thì đóng cửa sổ này và sửa trên trang.</div></div>
    <button class="btn pri" type="button" data-pv="dl">Tải file Word</button><button class="btn" type="button" data-pv="close">Đóng ✕</button></div>
    <div class="pvbody"><div class="pvload">Đang dựng bản xem trước…</div></div>`;
  document.body.appendChild(ov);ov.querySelector('[data-pv="close"]').focus();
  ov.addEventListener('click',e=>{const a=e.target.closest('[data-pv]')?.dataset.pv;if(a==='close'||e.target===ov)closePreview();if(a==='dl')renderDocx(j.b64,j.data,j.name);});
  const body=ov.querySelector('.pvbody');
  try{const blob=buildDocx(j.b64,j.data);
    await loadJs('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
    await loadJs('https://cdn.jsdelivr.net/npm/docx-preview@0.3.3/dist/docx-preview.min.js');
    if(!ov.isConnected)return;body.innerHTML='';
    await window.docx.renderAsync(blob,body,null,{inWrapper:true,breakPages:true,ignoreLastRenderedPageBreak:false,experimental:true});
    fitPreview(body);closePreview.fit=()=>fitPreview(body);window.addEventListener('resize',closePreview.fit);
  }catch(e){console.error(e);body.innerHTML=`<div class="pvload">${esc(e.message||String(e))}</div>`;}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.pvov')){e.stopImmediatePropagation();closePreview();}},true);

function libView(){
  const groups=[...new Set(library.map(t=>t.group))].sort((a,b)=>a.localeCompare(b,'vi'));
  const q=norm((S.libQ||'').trim()),ft=S.libT||'*',fg=groups.includes(S.libG)?S.libG:'*';
  const list=library.filter(t=>(ft==='*'||t.type===ft)&&(fg==='*'||t.group===fg)&&(!q||norm(t.text+' '+t.group).includes(q)))
    .sort((a,b)=>a.group.localeCompare(b.group,'vi')||a.type.localeCompare(b.type));
  return `<div class="head"><h2>Thư viện đầu việc</h2><p>Đầu việc mẫu theo vị trí việc làm (Phụ lục 2 cho KPI, Phụ lục 3 cho OKR). Dùng để chọn nhanh khi giao việc hoặc khi cán bộ tự đăng ký: gõ vài chữ ở ô Nội dung là hiện gợi ý.</p></div>

const nextMonth=()=>{const [y,m]=periods.at(-1).id.split('-').map(Number);return m===12?`${y+1}-01`:`${y}-${pad(m+1)}`;};
function chotPeriod(pid){let n=0;
  items.filter(i=>i.period===pid&&i.status==='chua').forEach(i=>{i.status='khongdat';i.reason='Chưa hoàn thành khi chốt tháng.';i.approvedAt=nowISO();i.approvedBy='Hệ thống';if(i.type==='KPI'&&i.src!=='ps')n++;});
  pObj(pid).state='closed';return n;}

        </fieldset>

          ${[['kyTruong','Trưởng Công an phường'],['kyPho','Phó trưởng (phê duyệt)']].map(([k,l])=>`<div class="field"><label for="pr-${k}">${l}</label><input type="text" id="pr-${k}" value="${esc(settings[k])}"></div>`).join('')}
        </fieldset>
        <div class="spreview" aria-label="Xem trước"><span class="lbl">Xem trước dòng in</span>

}

  const leaders=[...new Set(Object.values(settings.phuTrach).map(v=>(v||'').trim()).filter(Boolean))];
  return `<div class="ov" data-act="set-close-ov"><form class="modal panel pad stack" id="f-setm" role="dialog" aria-modal="true" aria-labelledby="sm-h" style="max-width:480px">

    <div class="field"><label for="sm-name">${isTo?'Tên tổ':'Tên chức vụ'}</label><input type="text" id="sm-name" required value="${esc(old)}" placeholder="${isTo?'Ví dụ: Tổ Cảnh sát khu vực':'Ví dụ: Phó trưởng'}"></div>

      <datalist id="sm-pt-list">${leaders.map(v=>`<option value="${esc(v)}">`).join('')}</datalist>
      <span class="sub">Chọn người đã có trong danh sách hoặc gõ mới. Có thể để trống và cài sau.</span></div>`
      :`<p class="formula" style="margin:0">Chức vụ bắt đầu bằng "Phó" được tính vào tỷ lệ 25% cấp Phó.</p>`}
    ${sm.i!=null&&users.some(u=>u[isTo?'to':'cv']===old)?`<p class="formula" style="margin:0">Đổi tên sẽ cập nhật cho ${users.filter(u=>u[isTo?'to':'cv']===old).length} cán bộ đang thuộc ${isTo?'tổ':'chức vụ'} này.</p>`:''}

// ================= SỰ KIỆN =================
function refreshList(){const l=$('#list');if(!l)return;l.innerHTML=S.view==='duyet'?approvalList():mineList(S.view);}
const sendDone=(i,lv)=>{i.status='cho';i.reason='';i.doneAt=nowISO();i.cham=lv==='cham'&&i.type==='KPI';i.level=lv==='cham'?'dat':lv||'dat';S.sel.delete(i.id);};
function updatePts(id){const i=items.find(x=>x.id===id),el=$('#pts-'+id);if(!i||!el)return;const t=calc(i.owner,i.period).tb,v=validCoef(coefOf(i));
  el.innerHTML=v!==null?`× ${num(t)} = <b>${num(v*t)}</b> điểm`:'<span class="neg">Hệ số 1,5 – 5, bước 0,1</span>';}

document.addEventListener('click',e=>{
  if(S.giaoMenu&&!e.target.closest('.ddwrap')){S.giaoMenu=false;render();}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,id=b.dataset.id,it=id&&items.find(i=>i.id===id);
  switch(a){
    case 'pw-eye':{const inp=document.getElementById(b.dataset.for);if(!inp)return;const show=inp.type==='password';inp.type=show?'text':'password';
      b.querySelector('svg').innerHTML=show?EYE_OFF:EYE_ON;const l=show?'Ẩn mật khẩu':'Hiện mật khẩu';b.title=l;b.setAttribute('aria-label',l);inp.focus();return;}
    case 'logout':{const tk=API.token;flushSync().finally(()=>call('logout',tk).catch(()=>{}));clearSession();}
      Object.assign(S,{user:null,itemOpen:null,itemD:{},addUser:false,dlSeen:{},giaoOpen:false,giaoMenu:false,editing:null,confirmDel:null,reasonFor:null,loginErr:'',menu:false,editUser:null,chot:null,revoke:null});S.sel.clear();S.qsel.clear();break;
    case 'nav':Object.assign(S,{setModal:null,setDel:null,view:b.dataset.v,giaoMenu:false,itemOpen:null,addUser:false,editUser:null,editing:null,confirmDel:null,reasonFor:null,menu:false,chot:null,revoke:null,tdCopy:''});if(b.dataset.v==='theodoi'&&pObj(curP()))S.period=curP();if(b.dataset.v==='tonghop'){const last=periods.filter(x=>x.id<curP()).at(-1);if(last)S.period=last.id;}window.scrollTo(0,0);if(Date.now()-API.lastLoad>60000)setTimeout(()=>refreshData(true),50);break;
    case 'goto':Object.assign(S,{view:b.dataset.v,editing:null,confirmDel:null});S.filter[b.dataset.v]=b.dataset.f;window.scrollTo(0,0);break;
    case 'menu':S.menu=!S.menu;break;
    case 'menu-close':S.menu=false;break;
    case 'done':sendDone(it,b.dataset.lv);toast(it.type==='KPI'?`Đã báo hoàn thành (${it.cham?'Không đảm bảo tiến độ':LV[it.level]}), chờ quản lý duyệt.`:'Đã báo hoàn thành OKR, chờ quản lý duyệt và chấm hệ số.');break;
    case 'bulk-done':{const v=b.dataset.v,lv=$('#bulk-lv')?.value||'dat';const list=listOf(v,S.user,S.period).filter(i=>S.sel.has(i.id)&&i.status==='chua');
      list.forEach(i=>sendDone(i,lv));toast(`Đã báo hoàn thành ${list.length} mục (${lv==='cham'?'Không đảm bảo tiến độ':LV[lv]}).`);break;}
    case 'edit':S.editing=id;S.confirmDel=null;S.itemOpen=null;render();setTimeout(()=>$('#it-text')?.focus());return;
    case 'item-new':S.itemOpen=b.dataset.v;S.itemWas=!!S.itemD[b.dataset.v];S.editing=null;render();setTimeout(()=>$('#it-text')?.focus());return;
    case 'item-close':closeItem();break;
    case 'item-close-ov':if(e.target!==b)return;closeItem();break;
    case 'item-discard':delete S.itemD[S.itemOpen];S.itemWas=false;toast('Đã xóa bản nháp.');break;
    case 'del':S.confirmDel=id;break;
    case 'del-no':S.confirmDel=null;break;
    case 'del-yes':items.splice(items.indexOf(it),1);S.confirmDel=null;S.sel.delete(id);toast('Đã xóa.');break;
    case 'askdel':it.status='xinxoa';S.sel.delete(id);toast('Đã gửi đề nghị xóa. Chỉ huy đồng ý thì KPI mới bị xóa.');break;
    case 'selfmiss':S.missFor=id;break;
    case 'selfmiss-cancel':S.missFor=null;break;
    case 'undo-selfmiss':Object.assign(it,{status:'chua',selfMiss:false,reason:'',approvedAt:null,approvedBy:null});toast('Đã hoàn tác, mục trở lại Chưa hoàn thành.');break;
    case 'undo-askdel':it.status='chua';toast('Đã rút đề nghị xóa.');break;
    case 'delok':log(it,'Đồng ý xóa KPI');items.splice(items.indexOf(it),1);toast('Đã xóa KPI theo đề nghị. Điểm TB của cán bộ được tính lại.');break;
    case 'delno':it.status='chua';log(it,'Từ chối đề nghị xóa');toast('Đã từ chối. KPI vẫn giữ nguyên.');break;
    case 'cstep':{const v=parseFloat(coefOf(it))||1.5,nv=Math.min(settings.okrMax,Math.max(settings.okrMin,Math.round((v+0.1*Number(b.dataset.d))*10)/10));
      S.coef[id]=String(nv);const inp=$('#cf-'+id);if(inp)inp.value=nv;updatePts(id);return;}
    case 'approve':if(!approveOne(it)){toast('Hệ số OKR phải từ 1,5 đến 5, bước 0,1.');render();setTimeout(()=>$('#cf-'+id)?.focus());return;}
      toast(it.type==='OKR'?`Đã duyệt OKR, hệ số ${num(it.coef)} = ${num(itemPts(it))} điểm.`:`Đã duyệt KPI (${LV[it.level]}${it.cham?`, không đảm bảo tiến độ: ${signed(itemPts(it))} điểm`:''}).`);break;
    case 'bulk-approve':{const list=queue().filter(i=>i.status==='cho'&&S.qsel.has(i.id));let n=0,bad=0;list.forEach(i=>approveOne(i)?n++:bad++);
      toast(bad?`Đã duyệt ${n} mục. ${bad} OKR có hệ số không hợp lệ, vẫn chờ duyệt.`:`Đã duyệt ${n} mục.`);break;}
    case 'reason':S.reasonFor={id,a:b.dataset.a};render();setTimeout(()=>$('#rs-text')?.focus());return;
    case 'reason-cancel':S.reasonFor=null;break;
    case 'qtype':S.qType=b.dataset.v;S.qsel.clear();break;
    case 'giao-menu':S.giaoMenu=!S.giaoMenu;break;
    case 'giao-new':{const d=giaoDraft(b.dataset.v);S.giaoWasDraft=!!giaoHas(d);S.giao=d;S.pick=d.pick;S.giaoOpen=true;S.giaoMenu=false;render();setTimeout(()=>$('#g-text')?.focus());return;}
    case 'giao-close':S.giaoOpen=false;if(giaoHas(S.giao))toast('Đã lưu bản nháp. Bấm "Mở tiếp" để giao tiếp.');break;
    case 'giao-close-ov':if(e.target!==b)return;S.giaoOpen=false;if(giaoHas(S.giao))toast('Đã lưu bản nháp. Bấm "Mở tiếp" để giao tiếp.');break;
    case 'giao-discard':delete S.giaoD[b.dataset.v];toast('Đã xóa bản nháp.');break;
    case 'pqsel':S.pqMgr=b.dataset.u;S.pqUnset=null;render();setTimeout(()=>$('#pq-edit')?.scrollIntoView({behavior:'smooth'}));return;
    case 'pq-unset':S.pqUnset=b.dataset.u;break;
    case 'pq-unset-no':S.pqUnset=null;break;
    case 'pq-unset-yes':{const x=uObj(b.dataset.u);x.role='cb';users.forEach(u=>u.approvers=u.approvers.filter(a=>a!==x.id));S.pqUnset=null;toast(`Đã xóa toàn bộ quyền duyệt của ${x.name}. Kiểm tra lại những người chưa có người duyệt.`);break;}
    case 'pqlf':S.pqLF=b.dataset.f;break;
    case 'tdf':S.tdF=b.dataset.f;break;
    case 'td-pickmiss':tdRows(S.period).filter(r=>r.st!=='ok').forEach(r=>S.tdSel.add(r.x.id));S.tdF='all';toast('Đã chọn những người chưa nhập đủ.');break;
    case 'td-send':{S.tdMsg=($('#td-msg')?.value||'').trim();const ids=[...S.tdSel].filter(id=>scope().some(x=>x.id===id));
      ids.forEach(id=>reminders.push({id:newId('r'),uid:id,period:S.period,by:S.user,at:nowISO(),text:S.tdMsg||`Đề nghị đồng chí nhập KPI, OKR ${pLabel(S.period)}.`,seen:false}));
      S.tdSel.clear();toast(`Đã gửi nhắc cho ${ids.length} người. Họ sẽ thấy ở trang Tổng quan.`);break;}
    case 'td-copy':{S.tdMsg=($('#td-msg')?.value||'').trim();const txt=tdCopyText();

  if(a==='selall'){const v=t.dataset.v,q=norm(S.q[v]);listOf(v,S.user,S.period).filter(i=>i.status==='chua'&&isOpen(i.period)&&(!q||norm(i.text).includes(q))).forEach(i=>t.checked?S.sel.add(i.id):S.sel.delete(i.id));refreshList();return;}
  if(a==='qsel'){t.checked?S.qsel.add(t.dataset.id):S.qsel.delete(t.dataset.id);refreshList();return;}
  if(a==='qselall'){const q=norm(S.q.duyet);queue().filter(i=>i.status==='cho'&&(!q||norm(uObj(i.owner).name+' '+i.owner+' '+i.text).includes(q))).forEach(i=>t.checked?S.qsel.add(i.id):S.qsel.delete(i.id));refreshList();return;}
  if(a==='lv'){S.lv[t.dataset.id]=t.value;return;}

  if(a==='pkgrp'){const k=t.dataset.k,v=t.dataset.v,mem=evalUsers().filter(u=>u[k]===v),on=mem.every(u=>S.pick.has(u.id));mem.forEach(u=>on?S.pick.delete(u.id):S.pick.add(u.id));render();return;}
  if(t.dataset.pk==='mode'){const st=PK[t.dataset.ns];st.mode=t.value;st.q='';render();return;}
  if(t.dataset.pk==='filter'){const st=PK[t.dataset.ns];st.filter[st.mode]=t.value;render();return;}
  if(a==='pkset'){const ns=t.dataset.ns,ppl=pickPool(ns),on=ppl.every(u=>pkSel[ns].has(u.id));ppl.forEach(u=>pkSel[ns].set(u.id,!on));render();return;}
  if(a==='pk'){pkSel[t.dataset.ns].set(t.dataset.u,t.checked);render();return;}
  if(t.id==='pq-mgr'){S.pqMgr=t.value;S.pqUnset=null;Object.assign(PK.pq,{mode:'to',filter:{to:'*',cv:'*'},q:''});render();return;}
  if(t.id==='pq-lf'){S.pqLF=t.value;render();return;}
  if(a==='td-sel'){t.checked?S.tdSel.add(t.dataset.u):S.tdSel.delete(t.dataset.u);render();return;}
  if(a==='td-selall'){const rows=[...document.querySelectorAll('[data-act=td-sel]')].map(x=>x.dataset.u);rows.forEach(id=>t.checked?S.tdSel.add(id):S.tdSel.delete(id));render();return;}
  if(t.id==='td-f'){S.tdF=t.value;render();return;}
  if(t.id==='td-to'){S.tdTo=t.value;render();return;}
  if(t.id==='acc-to'){S.accTo=t.value;render();return;}
  if(a==='rate'){const k=S.period+'|'+t.dataset.u;if(!t.value){delete ratings[k];toast(`Đã bỏ xếp loại ${uObj(t.dataset.u).name}.`);}else{ratings[k]=t.value;toast(`Đã xếp loại ${uObj(t.dataset.u).name}: ${RT[t.value]}.`);}render();return;}
  if(t.id==='period'){S.period=t.value;S.sel.clear();S.editing=null;render();return;}
  if(t.id==='pyear'){const ps=periods.filter(p=>p.id.startsWith(t.value)),cur=ps.find(p=>p.id.slice(5)===S.period.slice(5));S.period=(cur||ps.at(-1)).id;S.sel.clear();S.editing=null;render();return;}

  if(t.id==='g-lib'&&t.value){S.giao.text=library.find(x=>x.id===t.value).text;render();return;}

    if(S.editUser&&data.role!=='ql')users.forEach(u=>u.approvers=u.approvers.filter(a=>a!==S.editUser));
    if(S.editUser){const x=uObj(S.editUser);Object.assign(x,data);if(x.isAdmin&&x.evaluated&&!x.approvers.length)x.approvers=[x.id];toast('Đã lưu tài khoản.');S.editUser=null;}
    else{const id=$('#nu-id').value.trim().toLowerCase();if(uObj(id)){toast('Tên đăng nhập đã tồn tại.');render();return;}
      users.push({id,active:true,approvers:data.isAdmin?[id]:[],...data});S.addUser=false;S.userDraft=null;toast(`Đã tạo ${id}, mật khẩu ${DEFAULT_PW}.`);}}
  if(f.id==='f-set'){settings.base=Math.max(1,Number($('#st-base').value)||40);settings.lockDay=Math.min(28,Math.max(1,Number($('#st-lock').value)||5));toast('Đã lưu cài đặt.');}
  if(f.id==='f-pw'){const o=$('#pw-old').value,n=$('#pw-new').value,n2=$('#pw-new2').value,err=$('#pw-err');
    if(n!==n2){err.textContent='Hai lần nhập mật khẩu mới không khớp.';return;}
    err.textContent='Đang đổi…';
    call('changePassword',API.token,o,n).then(r=>{if(!r.ok){const el=$('#pw-err');if(el)el.textContent=r.err;return;}S.pwOpen=false;toast('Đã đổi mật khẩu.');render();})
      .catch(e=>{if(!sessionLost(e)){const el=$('#pw-err');if(el)el.textContent='Lỗi: '+(e.message||e);}});return;}
  render();
});

// ================= XUẤT FILE TỔNG HỢP =================
// Đọc mỗi bảng trên trang thành 1 sheet: mỗi ô 1 dòng chữ (dòng phụ nối bằng " · "), ô trống hoặc "—" ghi 0
function pageSheets(){const title=(LABEL[S.view]||'Báo cáo')+' · '+pLabel(S.rep.period),used={};
  return [...document.querySelectorAll('main section.panel')].filter(sec=>sec.querySelector('table')).map((sec,k)=>{
    const h=sec.querySelector('h3')?.textContent.trim()||('Bang '+(k+1));
    let name=h.replace(/[\[\]:*?\/\\]/g,' ').slice(0,31).trim()||('Bang '+(k+1));while(used[name])name=name.slice(0,28)+' '+(k+1);used[name]=1;
    const rows=[[{v:title,s:2}],[{v:h,s:1}]];
    sec.querySelector('table').querySelectorAll('tr').forEach(tr=>{rows.push([...tr.cells].map(c=>{const x=c.cloneNode(true);x.querySelectorAll('button,input,select').forEach(e=>e.remove());
        x.querySelectorAll('div').forEach(d=>d.replaceWith(d.textContent.trim()?' · '+d.textContent.trim():''));
        let v=x.textContent.replace(/\s+/g,' ').trim();const head=c.tagName==='TH';
        if(!head&&(v===''||v==='—')&&c.colSpan<=1)v='0';
        const n=/^[+−-]?\d+(,\d+)?$/.test(v)?Number(v.replace('−','-').replace(',','.')):null;
        return {v:n!==null&&!head?n:v,s:head?1:0};}));});
    return {name,rows};});}
// Tạo file Excel chuẩn (.xlsx) nhiều sheet bằng PizZip có sẵn. Dòng 3 là tiêu đề cột: cố định khi cuộn và có nút lọc.
function xlsxBlob(sheets){
  const X=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const col=i=>{let s='';i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=(i-m-1)/26;}return s;};
  const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',NS='http://schemas.openxmlformats.org',R=NS+'/officeDocument/2006/relationships';
  const z=new window.PizZip();
  sheets.forEach((sh,si)=>{const rows=sh.rows,widths=[];
    rows.forEach((r,ri)=>{if(ri<2)return;r.forEach((c,i)=>{widths[i]=Math.max(widths[i]||8,Math.min(60,String(c.v).length+2));});});
    const data=rows.map((r,ri)=>`<row r="${ri+1}">${r.map((c,ci)=>{const ref=col(ci)+(ri+1),st=c.s?` s="${c.s}"`:'';
        return typeof c.v==='number'?`<c r="${ref}"${st}><v>${c.v}</v></c>`:`<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${X(c.v)}</t></is></c>`;}).join('')}</row>`).join('');
    const nc=Math.max(1,(rows[2]||[]).length),filt=rows.length>3?`<autoFilter ref="A3:${col(nc-1)}${rows.length}"/>`:'';
    z.file(`xl/worksheets/sheet${si+1}.xml`,`${H}<worksheet xmlns="${NS}/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"${si===0?' tabSelected="1"':''}><pane ySplit="3" topLeftCell="A4" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${data}</sheetData>${filt}</worksheet>`);});
  z.file('[Content_Types].xml',`${H}<Types xmlns="${NS}/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`);
  z.file('_rels/.rels',`${H}<Relationships xmlns="${NS}/package/2006/relationships"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`);
  const dn=sheets.map((s,i)=>s.rows.length>3?`<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${X(s.name.replace(/'/g,"''"))}'!$A$3:$${col(Math.max(1,(s.rows[2]||[]).length)-1)}$${s.rows.length}</definedName>`:'').join('');
  z.file('xl/workbook.xml',`${H}<workbook xmlns="${NS}/spreadsheetml/2006/main" xmlns:r="${R}"><sheets>${sheets.map((s,i)=>`<sheet name="${X(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets>${dn?`<definedNames>${dn}</definedNames>`:''}</workbook>`);
  z.file('xl/_rels/workbook.xml.rels',`${H}<Relationships xmlns="${NS}/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="${R}/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="${R}/styles" Target="styles.xml"/></Relationships>`);
  z.file('xl/styles.xml',`${H}<styleSheet xmlns="${NS}/spreadsheetml/2006/main"><fonts count="3"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="14"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="3"><xf fontId="0"/><xf fontId="1" applyFont="1"/><xf fontId="2" applyFont="1"/></cellXfs></styleSheet>`);
  return z.generate({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});}
function exportXls(){
  if(!window.PizZip){toast('Chưa tải được thư viện tạo file. Kiểm tra mạng rồi thử lại.');render();return;}
  const sheets=pageSheets();if(!sheets.length){toast('Không có bảng nào để xuất.');render();return;}
  const [y,m]=S.rep.period.split('-');
  saveFile(`${S.view==='bcdau'?'TongHop_DauThang':'TongHop_CuoiThang'}_${m}_${y}.xlsx`,xlsxBlob(sheets));}
async function exportManyDocx(){const ppl=repPeople();if(!ppl.length){toast('Không có cán bộ nào để xuất.');render();return;}
  for(const x of ppl){await exportDocx(x.id,S.rep.period);await new Promise(r=>setTimeout(r,400));}}

    .catch(()=>{TK.clear();S.booting=false;render();});})();
